<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1390 900" font-family="Inter, Segoe UI, Arial, sans-serif" role="img" aria-label="Guardian v2 architecture: code-only discovery, detection and scoring; parallel AI agents checked by an evidence validator and critic; a human review queue; and a LangGraph fix workflow that pauses for human approval before sandbox build, tests, rescan and verification, all recorded in an evidence store and final report.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#44514a"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c46a12"/></marker>
  </defs>
  <rect width="1390" height="900" fill="#ffffff"/>
  <text x="40" y="42" font-size="22" font-weight="700" fill="#1d2b22">Software Supply Chain Guardian · architecture v2</text>
  <g font-size="12" fill="#1d2b22">
    <rect x="40" y="62" width="16" height="12" rx="2" fill="#f4f6f5" stroke="#5b6b61"/><text x="62" y="73">Code (deterministic)</text>
    <rect x="200" y="62" width="16" height="12" rx="2" fill="#e8f0fe" stroke="#3b6fd8"/><text x="222" y="73">AI agent (LLM)</text>
    <rect x="340" y="62" width="16" height="12" rx="2" fill="#fff1e0" stroke="#d9822b" stroke-width="2"/><text x="362" y="73">Human approval point</text>
    <rect x="520" y="62" width="16" height="12" rx="2" fill="#eceff1" stroke="#78909c"/><text x="542" y="73">Storage</text>
  </g>

  <g font-size="13" font-weight="700" fill="#5b6b61" letter-spacing="0.5" text-anchor="end">
    <text x="1350" y="104">1 · DISCOVER → DETECT → ENRICH → SCORE</text>
    <text x="1350" y="314">2 · AI REVIEW (LangGraph, one parallel branch per package)</text>
    <text x="1350" y="524">3 · FIX WORKFLOW (LangGraph with interrupt, runs only after approval)</text>
    <text x="1350" y="734">4 · EVIDENCE &amp; REPORT</text>
  </g>

  <g font-size="11.5" fill="#33413a">
    <rect x="40" y="114" width="230" height="120" rx="8" fill="#f4f6f5" stroke="#5b6b61"/>
    <text x="54" y="138" font-size="14" font-weight="700" fill="#1d2b22">Input</text>
    <text x="54" y="160">Public GitHub URL + ref</text><text x="54" y="178">Optional "compare with" ref</text><text x="54" y="196">or built-in demo app</text>

    <rect x="310" y="114" width="230" height="120" rx="8" fill="#f4f6f5" stroke="#5b6b61"/>
    <text x="324" y="138" font-size="14" font-weight="700" fill="#1d2b22">Discover</text>
    <text x="324" y="160">Fetch manifests, lockfiles,</text><text x="324" y="178">Dockerfile, CI files only</text><text x="324" y="196">Syft SBOM (CycloneDX)</text><text x="324" y="214">Dependency graph + paths</text>

    <rect x="580" y="114" width="230" height="120" rx="8" fill="#f4f6f5" stroke="#5b6b61"/>
    <text x="594" y="138" font-size="14" font-weight="700" fill="#1d2b22">Detect (parallel)</text>
    <text x="594" y="160">Grype + OSV-Scanner (CVEs)</text><text x="594" y="178">Typosquat, install scripts,</text><text x="594" y="196">unpinned image/CI, integrity</text><text x="594" y="214">Baseline diff: what changed</text>

    <rect x="850" y="114" width="230" height="120" rx="8" fill="#f4f6f5" stroke="#5b6b61"/>
    <text x="864" y="138" font-size="14" font-weight="700" fill="#1d2b22">Enrich</text>
    <text x="864" y="160">CISA KEV + EPSS exploit intel</text><text x="864" y="178">Prod vs dev scope</text><text x="864" y="196">Reachability (imports)</text>

    <rect x="1120" y="114" width="230" height="120" rx="8" fill="#f4f6f5" stroke="#5b6b61"/>
    <text x="1134" y="138" font-size="14" font-weight="700" fill="#1d2b22">Score</text>
    <text x="1134" y="160">SSVC decision tree</text><text x="1134" y="178">policy/risk.toml</text><text x="1134" y="196">Risk level, 0–100 score,</text><text x="1134" y="214">reasons, confidence 0–1</text>
  </g>
  <g stroke="#44514a" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <line x1="270" y1="174" x2="306" y2="174"/><line x1="540" y1="174" x2="576" y2="174"/><line x1="810" y1="174" x2="846" y2="174"/><line x1="1080" y1="174" x2="1116" y2="174"/>
    <polyline points="1235,234 1235,276 425,276 425,320"/>
  </g>
  <text x="560" y="270" font-size="11.5" fill="#44514a">findings grouped by package (medium and above)</text>

  <g font-size="11.5" fill="#33413a">
    <rect x="40" y="324" width="230" height="120" rx="8" fill="#e8f0fe" stroke="#3b6fd8" stroke-dasharray="5 3"/>
    <text x="54" y="348" font-size="14" font-weight="700" fill="#1d2b22">LLM providers</text>
    <text x="54" y="370">Groq → Gemini fallback</text><text x="54" y="388">Guardrails: redact secrets,</text><text x="54" y="406">wrap repo text as untrusted</text><text x="54" y="424">Strict JSON schemas</text>

    <rect x="310" y="324" width="230" height="120" rx="8" fill="#e8f0fe" stroke="#3b6fd8"/>
    <text x="324" y="348" font-size="14" font-weight="700" fill="#1d2b22">Analysts (parallel)</text>
    <text x="324" y="370">Vulnerability analyst</text><text x="324" y="388">Change &amp; provenance analyst</text><text x="324" y="406">Risk analyst: ±1 level,</text><text x="324" y="424">must cite evidence</text>

    <rect x="580" y="324" width="230" height="120" rx="8" fill="#f4f6f5" stroke="#5b6b61"/>
    <text x="594" y="348" font-size="14" font-weight="700" fill="#1d2b22">Evidence validator</text>
    <text x="594" y="370">Rejects claims whose CVE,</text><text x="594" y="388">package, version or file</text><text x="594" y="406">is not in cited evidence</text><text x="594" y="424">Enforces risk floors</text>

    <rect x="850" y="324" width="230" height="120" rx="8" fill="#e8f0fe" stroke="#3b6fd8"/>
    <text x="864" y="348" font-size="14" font-weight="700" fill="#1d2b22">Risk critic</text>
    <text x="864" y="370">Second AI pass re-checks</text><text x="864" y="388">accepted claims and</text><text x="864" y="406">risk adjustments</text>

    <rect x="1120" y="324" width="230" height="120" rx="8" fill="#fff1e0" stroke="#d9822b" stroke-width="2.4"/>
    <text x="1134" y="348" font-size="14" font-weight="700" fill="#1d2b22">Review queue</text>
    <text x="1134" y="370">Low confidence, SSVC Act,</text><text x="1134" y="388">critic disagreement</text><text x="1134" y="406">Confirm / Dismiss / Escalate</text><text x="1134" y="424">(dismiss = accepted risk)</text>
  </g>
  <g stroke="#44514a" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <line x1="540" y1="384" x2="576" y2="384"/><line x1="810" y1="384" x2="846" y2="384"/>
    <path d="M695,324 C695,296 455,296 455,320"/>
    <polyline points="1235,444 1235,486 155,486 155,530"/>
  </g>
  <line x1="1080" y1="384" x2="1116" y2="384" stroke="#c46a12" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="270" y1="384" x2="306" y2="384" stroke="#3b6fd8" stroke-width="1.4" stroke-dasharray="4 3" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="520" y="292" font-size="11" fill="#44514a">rejected → revise once</text>
  <text x="470" y="480" font-size="11.5" fill="#44514a">fix candidates computed by code from scanner fix data</text>

  <g font-size="11.5" fill="#33413a">
    <rect x="40" y="534" width="230" height="120" rx="8" fill="#e8f0fe" stroke="#3b6fd8"/>
    <text x="54" y="558" font-size="14" font-weight="700" fill="#1d2b22">Remediation planner</text>
    <text x="54" y="580">Chooses only among code</text><text x="54" y="598">candidates; rule-based fix</text><text x="54" y="616">if AI is off. Expected</text><text x="54" y="634">risk reduction shown</text>

    <rect x="310" y="534" width="230" height="120" rx="8" fill="#fff1e0" stroke="#d9822b" stroke-width="2.4"/>
    <text x="324" y="558" font-size="14" font-weight="700" fill="#1d2b22">Human approval</text>
    <text x="324" y="580">LangGraph interrupt():</text><text x="324" y="598">graph pauses until a person</text><text x="324" y="616">approves or rejects</text><text x="324" y="634">Durable checkpoint</text>

    <rect x="580" y="534" width="230" height="120" rx="8" fill="#f4f6f5" stroke="#5b6b61"/>
    <text x="594" y="558" font-size="14" font-weight="700" fill="#1d2b22">Sandbox apply</text>
    <text x="594" y="580">Throwaway copy at the</text><text x="594" y="598">scanned commit; upgrade,</text><text x="594" y="616">parent upgrade or override</text><text x="594" y="634">--ignore-scripts always</text>

    <rect x="850" y="534" width="230" height="120" rx="8" fill="#f4f6f5" stroke="#5b6b61"/>
    <text x="864" y="558" font-size="14" font-weight="700" fill="#1d2b22">Build &amp; test</text>
    <text x="864" y="580">Container, no network,</text><text x="864" y="598">read-only source, no caps,</text><text x="864" y="616">CPU / memory / time limits</text><text x="864" y="634">Failing tests block the fix</text>

    <rect x="1120" y="534" width="230" height="120" rx="8" fill="#f4f6f5" stroke="#5b6b61"/>
    <text x="1134" y="558" font-size="14" font-weight="700" fill="#1d2b22">Rescan &amp; verify</text>
    <text x="1134" y="580">Full rescan of sandbox</text><text x="1134" y="598">Before vs after: fixed,</text><text x="1134" y="616">introduced, still open</text><text x="1134" y="634">Plain-language verdict</text>
  </g>
  <g stroke="#44514a" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <line x1="540" y1="594" x2="576" y2="594"/><line x1="810" y1="594" x2="846" y2="594"/><line x1="1080" y1="594" x2="1116" y2="594"/>
    <polyline points="1235,654 1235,700 985,700 985,740"/>
  </g>
  <line x1="270" y1="594" x2="306" y2="594" stroke="#c46a12" stroke-width="1.8" marker-end="url(#ah)"/>
  <polyline points="425,654 425,690" stroke="#c46a12" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <text x="434" y="686" font-size="11" fill="#9a5310">rejected → recorded, nothing applied</text>

  <g font-size="11.5" fill="#33413a">
    <rect x="40" y="744" width="770" height="110" rx="8" fill="#eceff1" stroke="#78909c"/>
    <text x="54" y="768" font-size="14" font-weight="700" fill="#1d2b22">Evidence &amp; audit store (written by every stage)</text>
    <text x="54" y="792">Raw scanner output with SHA-256 fingerprints · SBOM · graph · findings with evidence ids</text>
    <text x="54" y="812">Agent trace (which provider answered each step) · accepted and rejected AI claims with reasons</text>
    <text x="54" y="832">Human review decisions (history) · fix runs (decision, build, tests, diff) · workflow checkpoints</text>

    <rect x="850" y="744" width="270" height="110" rx="8" fill="#f4f6f5" stroke="#5b6b61"/>
    <text x="864" y="768" font-size="14" font-weight="700" fill="#1d2b22">Guardian report</text>
    <text x="864" y="792">report.html (people)</text><text x="864" y="812">report.json (machines)</text><text x="864" y="832">One chronological audit trail</text>

    <rect x="1160" y="744" width="190" height="110" rx="8" fill="#f4f6f5" stroke="#5b6b61"/>
    <text x="1174" y="768" font-size="14" font-weight="700" fill="#1d2b22">Web UI</text>
    <text x="1174" y="792">Findings, why-this-risk,</text><text x="1174" y="812">graph, review queue,</text><text x="1174" y="832">fixes, what changed</text>
  </g>
  <line x1="810" y1="799" x2="846" y2="799" stroke="#44514a" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="1120" y1="799" x2="1156" y2="799" stroke="#44514a" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="40" y="884" font-size="11.5" fill="#5b6b61">Nothing is merged, pushed or deployed automatically. Repository code never runs on the host. Risk levels come from code; AI can only explain, suggest ±1 level with evidence, and choose among code-computed fixes.</text>
</svg>
